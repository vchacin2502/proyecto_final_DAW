version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: www/Dockerfile
    expose:
      - 8000
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafit_db}
      POSTGRES_USER: ${POSTGRES_USER:-cafit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafit_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafit_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: contenedor_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ../staticfiles:/app/staticfiles:ro
    networks:
      - default
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'while true; do certbot renew --webroot -w /var/www/certbot --quiet 2>/dev/null; sleep 12h; done'
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
