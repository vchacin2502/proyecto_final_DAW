events {}
http {
    upstream django_backend {
        server web:8000;
    }
    server {
        listen 80;
        server_name cafit.freemyip.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            proxy_pass http://django_backend;
        }
    }
}
